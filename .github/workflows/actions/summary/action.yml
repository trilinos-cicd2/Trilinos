name: "Write AT2 Summary"
description: |
  Writes a markdown summary to $GITHUB_STEP_SUMMARY that contains
  the container image, the GenConfig build ID and CDash links.

inputs:
  image:
    description: |
      The image identifier to display.  The caller can pass a fallback value.
    required: false
    default: "unknown"

  genconfig-build-name-file:
    description: |
      Path (relative to the working‑directory) of the file that contains
      the GenConfig build name (generated by the test step).
    required: false

  at2-url-file:
    description: |
      Path (absolute or relative) of the file that contains the CDash URL
      for the current build.
    required: false

  at2-all-builds:
    description: |
      Path (absolute or relative) of the file that contains the CDash URL
      that lists all builds for the PR.
    required: false

  extra-links:
    description: |
      New‑line separated list of extra markdown links to add under
      “Helpful Links”.  If empty the default hard‑coded links are used.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "Write summary to $GITHUB_STEP_SUMMARY"
      shell: bash -e {0}
      run: |
        IMAGE="${{ inputs.image }}"
        GENCONFIG_FILE="${{ inputs.genconfig-build-name-file }}"
        AT2_URL_FILE="${{ inputs.at2-url-file }}"
        AT2_ALL_FILE="${{ inputs.at2-all-builds-file }}"
        EXTRA_LINKS="${{ inputs.extra-links }}"
        echo "Summary URLs ${AT2_ALL_BUILDS}"

