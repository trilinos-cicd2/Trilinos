name: "Write AT2 Summary"
description: |
  Writes a markdown summary to $GITHUB_STEP_SUMMARY that contains
  the container image, the GenConfig build ID and CDash links.

inputs:
  image:
    description: |
      The image identifier to display.  The caller can pass a fallback value.
    required: false
    default: "unknown"

  genconfig-build-name-file:
    description: |
      Path (relative to the working‑directory) of the file that contains
      the GenConfig build name (generated by the test step).
    required: false

  at2-url-file:
    description: |
      Path (absolute or relative) of the file that contains the CDash URL
      for the current build.
    required: false

  at2-all-builds:
    description: |
      Path (absolute or relative) of the file that contains the CDash URL
      that lists all builds for the PR.
    required: false

  extra-links:
    description: |
      New‑line separated list of extra markdown links to add under
      “Helpful Links”.  If empty the default hard‑coded links are used.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "This is another step!"
      shell: bash -e {0}
      run: |
        echo "::group::Group name!"
        echo "This is another step! How does it collapse this output?"
        echo "::endgroup::"

    - name: "Write summary to $GITHUB_STEP_SUMMARY"
      shell: bash -e {0}
      run: |
        IMAGE="${{ inputs.image }}"
        GENCONFIG_FILE="${{ inputs.genconfig-build-name-file }}"
        AT2_URL_FILE="${{ inputs.at2-url-file }}"
        AT2_ALL_FILE="${{ inputs.at2-all-builds-file }}"
        EXTRA_LINKS="${{ inputs.extra-links }}"
        echo "Summary URLs ${AT2_ALL_BUILDS}"
        pwd
        ls
        env | grep "AT2"
        echo " Full path: ${AT2_IMAGE_FULLPATH}"
        echo "## Run Info" >> $GITHUB_STEP_SUMMARY
        echo "Image: ${AT2_IMAGE_FULLPATH:-${AT2_IMAGE:-unknown}}" >> $GITHUB_STEP_SUMMARY
        echo "GenConfig Build ID: $(cat ./genconfig_build_name.txt)" >> $GITHUB_STEP_SUMMARY
        echo "## CDash Links" >> $GITHUB_STEP_SUMMARY
        echo "### Current Build" >> $GITHUB_STEP_SUMMARY
        AT2_URL=$(</home/runner/AT2_URL.txt)
        echo $AT2_URL >> $GITHUB_STEP_SUMMARY
        echo "### All Builds" >> $GITHUB_STEP_SUMMARY
        AT2_ALL_BUILDS=$(</home/runner/AT2_ALL_BUILDS.txt)
        echo $AT2_ALL_BUILDS >> $GITHUB_STEP_SUMMARY
        echo "## Helpful Links" >> $GITHUB_STEP_SUMMARY
        echo "https://github.com/trilinos/Trilinos/wiki/Reproducing-Pull-Request-Testing-Errors" >> $GITHUB_STEP_SUMMARY
        echo "https://github.com/trilinos/Trilinos/wiki/Containers" >> $GITHUB_STEP_SUMMARY
        echo "https://gitlab-ex.sandia.gov/trilinos-project/trilinos-containers/-/wikis/Containers-at-Sandia" >> $GITHUB_STEP_SUMMARY
