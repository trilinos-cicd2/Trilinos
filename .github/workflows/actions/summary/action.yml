name: "Write AT2 Summary"
description: |
  Writes a markdown summary to $GITHUB_STEP_SUMMARY that contains
  the container image, the GenConfig build ID and CDash links.

inputs:
  image:
    description: |
      The image identifier to display.  The caller can pass a fallback value.
    required: false
    default: "unknown"

  genconfig-build-name-file:
    description: |
      Path (relative to the working‑directory) of the file that contains
      the GenConfig build name (generated by the test step).
    required: false

  at2-url-file:
    description: |
      Path (absolute or relative) of the file that contains the CDash URL
      for the current build.
    required: false

  at2-all-builds:
    description: |
      Path (absolute or relative) of the file that contains the CDash URL
      that lists all builds for the PR.
    required: false

  extra-links:
    description: |
      New‑line separated list of extra markdown links to add under
      “Helpful Links”.  If empty the default hard‑coded links are used.
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: "This is another step!"
      shell: bash -e {0}
      run: |
        echo "::group::Group name!"
        echo "This is another step! How does it collapse this output?"
        echo "::endgroup::"

    - name: "Write summary to $GITHUB_STEP_SUMMARY"
      shell: bash -e {0}
      working-directory: /home/Trilinos/build
      run: |
        pwd
        ls
        env | grep "AT2"

        echo "https://github.com/orgs/community/discussions/27088" > /home/runner/AT2_URL.txt
        echo "https://github.com/orgs/community/discussions/27088" > /home/runner/AT2_ALL_BUILDS.txt
        AT2_URL=$(</home/runner/AT2_URL.txt)
        AT2_ALL_BUILDS=$(</home/runner/AT2_ALL_BUILDS.txt)

        cat <<EOF >> "$GITHUB_STEP_SUMMARY"

        ## Run Info:
        Image:
        \`\`\`
        ${AT2_IMAGE_FULL_PATH:-${AT2_IMAGE:-unknown}}
        \`\`\`
        GenConfig Build ID:
        \`\`\`
        ${GENCONFIG_BUILD_NAME:-unknown}
        \`\`\`

        ### CDash Links
        - [Current Build](${AT2_URL:-unknown})
        - [All Builds](${AT2_ALL_BUILDS:-unknown})
        ### Helpful Wiki Links
        - [How to Reproducing Pull Request Testing Errors](https://github.com/trilinos/Trilinos/wiki/Reproducing-Pull-Request-Testing-Errors)
        - [How to use Trilinos Containers](https://github.com/trilinos/Trilinos/wiki/Containers)
        - [Containers at Sandia](https://gitlab-ex.sandia.gov/trilinos-project/trilinos-containers/-/wikis/Containers-at-Sandia)
        EOF
